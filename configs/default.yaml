# Real run config: fine-tunes a ~1-2B-parameter open LLM with LoRA.
# Needs: a machine with a GPU (even a small one, e.g. 8GB VRAM, is enough
# for LoRA on a model this size) and internet access to huggingface.co.
# Defaults below are tuned to just work on a free Google Colab T4 GPU.

data:
  train_size: 3000
  val_size: 200
  test_size: 200
  grid_size_range: [6, 12]       # grids sampled uniformly between 6x6 and 12x12
  obstacle_density_range: [0.10, 0.25]
  min_optimal_len: 3
  seed: 42
  out_dir: data

model:
  # Ungated open model -- works immediately, no Hugging Face license
  # approval or token needed. ~1.5B params.
  name: Qwen/Qwen2.5-1.5B-Instruct
  # Other ungated options of similar size, if you want to compare:
  #   Qwen/Qwen2.5-0.5B-Instruct        (smaller/faster, ~0.5B)
  #   HuggingFaceTB/SmolLM2-1.7B-Instruct
  #
  # Want the "true" Llama-3.2-1B-Instruct instead? It is GATED on Hugging
  # Face -- you'll hit a 403 GatedRepoError like the one above until you:
  #   1) log in to huggingface.co, open
  #      https://huggingface.co/meta-llama/Llama-3.2-1B-Instruct, and click
  #      "Agree and access repository" (approval can take anywhere from
  #      instant to a few hours -- it's Meta's review, not something this
  #      code controls),
  #   2) create a token at https://huggingface.co/settings/tokens,
  #   3) in Colab, actually run the `from huggingface_hub import login;
  #      login()` cell with that token BEFORE running data_gen/train/evaluate.
  # Then set: name: meta-llama/Llama-3.2-1B-Instruct
  max_length: 640

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: null   # null = auto-detect (q_proj/k_proj/v_proj/o_proj for Llama/Qwen)

train:
  output_dir: outputs/lora-pathfinding
  num_train_epochs: 3
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  logging_steps: 20
  save_steps: 200
  eval_steps: 200
  # T4 (free Colab) doesn't support bf16 well -- use fp16 there.
  # On an A100/newer GPU (Colab Pro), flip these: bf16 true, fp16 false.
  bf16: false
  fp16: true
  max_steps: -1 # -1 = run full num_train_epochs

eval:
  max_new_tokens: 96
  report_path: outputs/eval_report.json
